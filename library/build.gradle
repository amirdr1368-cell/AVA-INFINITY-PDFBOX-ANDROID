plugins {
    id 'com.android.library'
}

ext {
    PUBLISH_GROUP_ID = 'com.tom-roush'
    PUBLISH_ARTIFACT_ID = 'pdfbox-android'
    PUBLISH_VERSION = VERSION_NAME
}

android {
    namespace 'com.tom_roush.pdfbox'
    compileSdk 35

    defaultConfig {
        minSdk 14
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-proguard-rules.txt'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        test {
            resources.srcDirs = ['src/main/assets', 'src/test/resources']
        }
        androidTest {
            assets.srcDirs = ['src/test/resources']
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api "org.bouncycastle:bcprov-jdk15to18:1.73"
    api "org.bouncycastle:bcpkix-jdk15to18:1.73"
    api "org.bouncycastle:bcutil-jdk15to18:1.73"

    // Optional JPX codec is compile-time only, matching the upstream PDFBox Android project.
    compileOnly 'com.gemalto.jp2:jp2-android:1.0.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'com.googlecode.java-diff-utils:diffutils:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.5.1'
}
