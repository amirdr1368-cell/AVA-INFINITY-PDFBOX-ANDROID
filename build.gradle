// Top-level build file where you can add configuration options common to all sub-projects/modules.
defaultTasks 'clean','build','connectedCheck'

buildscript {
    repositories {
        mavenCentral()
        google()
        jcenter() // legacy dependencies
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    version = VERSION_NAME

    repositories {
        // JP2ForAndroid 1.0.3 is mirrored in the Appodeal public repository.
        maven { url "https://artifactory.appodeal.com/appodeal-public/" }
        mavenCentral()
        google()
        jcenter()
    }

//    Show more warnings if desired
