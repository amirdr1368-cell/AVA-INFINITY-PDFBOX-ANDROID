pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JP2ForAndroid 1.0.3 is mirrored in Appodeal's public Maven repository.
        maven { url = uri('https://artifactory.appodeal.com/appodeal-public/') }
    }
}

rootProject.name = 'AVA-INFINITY'
include ':app', ':library'
