name: AVA INFINITY Manual Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ava-manual-android-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Test PDFBox, then assemble sample APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run PDFBox library unit tests
        run: ./gradlew --no-daemon clean :library:testDebugUnitTest

      - name: Assemble sample debug APK
        run: ./gradlew --no-daemon :sample:assembleDebug

      - name: Upload verified sample APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-INFINITY-PDFBox-Sample-APK
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
