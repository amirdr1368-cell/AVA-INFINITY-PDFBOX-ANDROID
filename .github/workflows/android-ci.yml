name: AVA INFINITY Android Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - ava/mobile-app-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AVA APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon clean test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-INFINITY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
