name: AVA INFINITY Verified Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - ava/build-verified

permissions:
  contents: read

concurrency:
  group: ava-verified-android-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Test first, then assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout unified source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run all AVA and PDFBox unit tests
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest :library:testDebugUnitTest

      - name: Assemble installable debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload verified AVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-INFINITY-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
