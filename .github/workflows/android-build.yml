name: AVA INFINITY Verified Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - ava/mobile-app-integration

permissions:
  contents: read

concurrency:
  group: ava-verified-android-build
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Test first, then assemble AVA Next APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout unified source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ava-infinity-debug-keystore-v1

      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run all AVA and PDFBox unit tests
        run: ./gradlew --no-daemon clean :app:testDebugUnitTest :library:testDebugUnitTest

      - name: Assemble installable AVA Next debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload verified AVA Next APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-INFINITY-Next-1.0.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
