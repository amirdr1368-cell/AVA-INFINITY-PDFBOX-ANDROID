name: AVA INFINITY Unified Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'ava/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout unified source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run AVA and PDFBox unit tests
        run: gradle :app:testDebugUnitTest :library:testDebugUnitTest

      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug

      - name: Upload AVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AVA-INFINITY-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
